[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exotic-bsm"
version = "0.1.0"
description = "BSM sensitivities in exotic atoms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "particle>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["exotic_bsm*"]
